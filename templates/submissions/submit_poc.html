<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  .underlined-input {
    width: 100%;
    background-color: transparent !important;
    border: none !important;
    border-bottom: 1.5px solid #CBD5E1 !important;
    border-radius: 0 !important;
    padding: 0.5rem 0 !important;
    font-size: 1rem !important;
    font-weight: 500 !important;
    color: #1E293B !important;
    outline: none !important;
    box-shadow: none !important;
  }
  .underlined-input:focus {
    border-bottom-color: #1E293B !important;
  }
</style>

<div class="w-full max-w-4xl p-4 md:p-8">
  <!-- Back Button -->
  <a href="javascript:history.back()" class="inline-flex items-center gap-2 px-5 py-2 mb-6 text-white font-medium bg-[#1F77D0]/80 hover:bg-[#1F77D0] border-2 border-white rounded-xl transition-all shadow-md cursor-pointer text-sm">
    <i class="fas fa-arrow-left text-xs"></i> Back
  </a>

  <!-- Main Card -->
  <div class="bg-white rounded-3xl p-8 md:p-10 shadow-lg w-full">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-3" style="font-family: General Sans, sans-serif;">Submission</h1>
    <div class="h-px bg-gray-200 w-full mb-6"></div>

    <h2 class="text-base md:text-lg font-semibold text-gray-800 mb-2" style="font-family: General Sans, sans-serif;">Submit Single POC</h2>
    <p class="text-sm text-gray-500 mb-8 leading-relaxed">
      Submit single point of contact for us to get in touch with.
    </p>

    <form action="#" method="post" id="contact_form">
      {% csrf_token %}

      <div class="mb-6">
        <label class="text-sm text-gray-500 font-medium block mb-1">Name of POC<span class="text-red-500">*</span></label>
        {{ form.name }}
      </div>

      <div class="mb-6">
        <label class="text-sm text-gray-500 font-medium block mb-1">Designation of POC<span class="text-red-500">*</span></label>
        {{ form.design }}
      </div>

      <div class="mb-6">
        <label class="text-sm text-gray-500 font-medium block mb-1">College of POC<span class="text-red-500">*</span></label>
        {{ form.college }}
      </div>

      <div class="mb-6">
        <label class="text-sm text-gray-500 font-medium block mb-1">Contact Number of POC<span class="text-red-500">*</span></label>
        {{ form.contact }}
      </div>

      <div class="mt-8">
        <button type="submit" style="background-color: #FFC548;" class="text-gray-900 font-bold px-8 py-3 rounded-xl inline-flex items-center gap-2 hover:opacity-90 transition-opacity shadow-sm text-sm cursor-pointer">
          Submit <i class="fas fa-arrow-right text-xs"></i>
        </button>
      </div>
    </form>

    <div class="mt-8 pt-4 border-t border-gray-100">
      <a href="{% url 'poc-csv-create' %}" class="text-sm text-gray-500 hover:text-gray-800 underline">
        You can also submit Multiple POCs
      </a>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const inputs = document.querySelectorAll('#contact_form input[type="text"], #contact_form input[type="tel"]');
    inputs.forEach(input => input.classList.add('underlined-input'));
  });
</script>
