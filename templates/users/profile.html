{% extends '../basic.html' %}
{% block title %}
  Profile | Alcheringa
{% endblock %}

{% block style %}
<style>
  html, body {
    scroll-behavior: smooth;
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
  }
  ::-webkit-scrollbar {
    display: none;
    width: 0px;
    height: 0px;
    background: transparent;
  }
  * {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  *::-webkit-scrollbar {
    display: none;
  }
</style>
{% endblock %}

{% block body %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/font.css' %}">
<div class="flex pt-16 portal-bg" style="background: #5797CE url('{% static "images/bg (1).png" %}') no-repeat center center / cover fixed; min-height: 100vh;">
  {% include 'navbar.html' %}

  <div class="flex-1 p-6 md:p-10 max-w-5xl">
    {% include 'users/profile_update.html' %}
  </div>
</div>
{% endblock %}
{% block script %}

{% endblock %}
