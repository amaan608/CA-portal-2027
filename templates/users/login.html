{% load static %}
<style>
	.backdrop {
    background-color: blue;
}
.popup {
    position: fixed;
    top: -150%;
    left: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.25);
    -webkit-transform: translate(-50%, -50%) scale(1.25);
    -moz-transform: translate(-50%, -50%) scale(1.25);
    -ms-transform: translate(-50%, -50%) scale(1.25);
    -o-transform: translate(-50%, -50%) scale(1.25);
    width: 400px;
    padding: 20px 30px;
    background: white;
    box-shadow: 2px 2px 5px 5px rgba(0, 0, 0, 0.15);
    border-radius: 10px;
    -webkit-border-radius: 10px;
    -moz-border-radius: 10px;
    -ms-border-radius: 10px;
    -o-border-radius: 10px;
    transition: top 0ms ease-in-out 200ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
    -webkit-transition: top 0ms ease-in-out 200ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
    -moz-transition: top 0ms ease-in-out 200ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
    -ms-transition: top 0ms ease-in-out 200ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
    -o-transition: top 0ms ease-in-out 200ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
}
.popup.active {
    top: 50%;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    -webkit-transform: translate(-50%, -50%) scale(1);
    -moz-transform: translate(-50%, -50%) scale(1);
    -ms-transform: translate(-50%, -50%) scale(1);
    -o-transform: translate(-50%, -50%) scale(1);
    transition: top 0ms ease-in-out 0ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
    -webkit-transition: top 0ms ease-in-out 0ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
    -moz-transition: top 0ms ease-in-out 0ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
    -ms-transition: top 0ms ease-in-out 0ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
    -o-transition: top 0ms ease-in-out 0ms, opacity 200ms ease-in-out 0ms, transform 200ms ease-in-out 0ms;
}
.popup .close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 15px;
    height: 15px;
    background: #888;
    color: #eee;
    text-align: center;
    line-height: 15px;
    border-radius: 15px;
    -webkit-border-radius: 15px;
    -moz-border-radius: 15px;
    -ms-border-radius: 15px;
    -o-border-radius: 15px;
    cursor: pointer;
}
.popup .form-login h2 {
    text-align: center;
    color: #222;
    margin: 10px 0px 20px;
    font-size: 25px;
}
.popup .form-login .form-element {
    display: flex;
    flex-direction: column;
    margin: 15px 20px 15px 0px;
}
.popup .form-login .form-element label {
    font-size: 14px;
    color: #222;
}
.popup .form-login .form-element input[type="text"],
.popup .form-login .form-element input[type="password"] {
    margin-top: 5px;
    display: block;
    width: 100%;
    padding: 10px;
    outline: none;
    border: 1px solid #aaa;
    border-radius: 5px;
    -webkit-border-radius: 5px;
    -moz-border-radius: 5px;
    -ms-border-radius: 5px;
    -o-border-radius: 5px;
}
.popup .form-login .form-element button {
    align-items: center;
    width: 100%;
    height: 40px;
    border: none;
    outline: none;
    font-size: 15px;
    background: rgba(0, 158, 119, 1);
    color: #f5f5f5;
    border-radius: 10px;
    -webkit-border-radius: 10px;
    -moz-border-radius: 10px;
    -ms-border-radius: 10px;
    -o-border-radius: 10px;
    cursor: pointer;
}
.popup .form-login .form-element a {
    display: block;
    text-align: right;
    font-size: 15px;
    color: rgba(0, 158, 119, 1);
    text-decoration: none;
    font-weight: 600;
}
@media only screen and (max-width: 600px) {
    .popup {
        width: 96%;
        height: auto;
    }
}
</style>
<div class="backdrop">
	<div id="modal" class="popup">
		<span class="close-btn">&times;</span>
		<form method="POST" class="form-login" id="form-login">{% csrf_token %}
			<h2>Login</h2>
			<div class="form-element">
				<label for="email"><b>Email</b></label>
				<input type="text" name="email" id="email" placeholder="Enter Email" required/>
			</div>
			<div class="form-element">
				<label for="password"><b>Password</b></label>
				<input type="password" name="password" id="password" placeholder="Enter password" required/>
			</div>
			<div class="form-element">
				<a href="{% url 'password_reset'%}">Forgot password?</a>
			</div>
			<div class="form-element">
				<button onclick="gtag('event', 'click', {'event_category': 'Button','event_label': 'Register Button'});" type="submit">Login</button>
			</div>
			{% if request.session.unactivated_email %}
			<div class="form-element" style="margin-top: 8px;">
				<div style="background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #856404;">
					⚠️ Your account is not activated yet.
					<a href="{% url 'resend_activation' %}?email={{ request.session.unactivated_email }}"
					   style="display:block; margin-top:6px; text-align:center; background: rgba(0,158,119,1); color:#fff; padding: 7px 0; border-radius:6px; font-weight:600; text-decoration:none;">
						📧 Resend Activation Email
					</a>
				</div>
			</div>
			{% endif %}
			<div class="form-element">
				<p>Don't have an account yet?<a href="{% url 'register_single' %}">Register Now</a></p>
			</div>
		</form>
	</div>
</div>

<script>
	document.querySelector("#navlink5").addEventListener("click", function () {
		document.querySelector(".popup").classList.add("active");
		$(".backdrop").fadeTo(200, 1);
	});

	document.querySelector(".close-btn").addEventListener("click", function () {
		document.querySelector(".popup").classList.remove("active");
		$(".backdrop").fadOut(200);
	});
	//LOGIN FORM GOOD
	const login_form = document.getElementById('form-login')
	login_form.addEventListener('submit', loginemail)
	async function loginemail(event) {
        event.preventDefault()
		$.ajax({
			url: "{% url 'login' %}",
			type: "POST",
			headers: {
				"X-CSRFTOKEN": "{{ csrf_token }}"
			},
			data: $(login_form).serialize(),
			success: function (data) {
				if (data.status === 'ok') {
					// Login successful — go to dashboard
					window.location.href = data.redirect || '/';
				} else {
					// Login failed — reload page to show error messages
					location.replace(location.href);
				}
			},
			error: function () {
                location.replace(location.href);
			}
		});
	}
</script>
